<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Added to a phone's home screen, the page opens like an app (on iPhone too).
         %BASE_URL% is the site path, filled in by scripts/build-web.mjs. -->
    <link rel="manifest" href="%BASE_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%WEB_TITLE%" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>يحتاج «لوحتي» إلى تفعيل JavaScript في المتصفح.</noscript>
    <div id="root"></div>
    <script>
    // Registered here rather than in the bundle so a browser that never loads
    // the app still has it, and so the scope is the app's own path.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('%BASE_URL%/sw.js', { scope: '%BASE_URL%/' });
      });
    }
  </script>
</body>
</html>
