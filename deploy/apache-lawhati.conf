# «لوحتي» on the web: https://faisaldev.site/lawhati-app/
#
# NOT /lawhati/. Another instance of this app on this server left a server-wide
# redirect for /lawhati/ pointing at its own host, with no host guard, so every
# /lawhati/* address here answers 301 to that domain. The site's account pages moved
# to /apps/lawhati/* for the same reason.
#
# Scoping is by path, not by host: Alias is resolved before <If> conditions are
# evaluated, so a host guard around it cannot be relied on. /lawhati-app is unique
# across this server, so nothing collides. The stricter option, if you want this app
# off the other sites entirely, is to move the Alias and <Directory> below into the
# faisaldev.site vhost instead of enabling this conf.
#
# Requires: a2enmod headers. Undo with: a2disconf lawhati && systemctl reload apache2
Alias /lawhati-app /var/www/lawhati-app

<Directory /var/www/lawhati-app>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # A single-page app: any address under /lawhati-app/ (a board, a card…) gets
    # index.html, which then shows the right screen.
    FallbackResource /lawhati-app/index.html
</Directory>

<IfModule mod_headers.c>
    # Pages are checked for a newer version on every visit…
    <Location "/lawhati-app/">
        Header set Cache-Control "no-cache"
    </Location>
    # …while scripts and assets carry a content hash in their names, so they can be kept for good.
    <LocationMatch "^/lawhati-app/(_expo|assets)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>
