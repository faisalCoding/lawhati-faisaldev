# «لوحتي» on the web: https://faisaldev.site/lawhati/
# A fresh instance — it carries no old address to redirect from.
# Serves the built web app from /var/www/lawhati; nothing else on the site changes.
# Requires: a2enmod headers rewrite. Undo with: a2disconf lawhati && systemctl reload apache2
Alias /lawhati /var/www/lawhati

<Directory /var/www/lawhati>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted


    # A single-page app: any address under /lawhati/ (a board, a card…) gets index.html,
    # which then shows the right screen.
    FallbackResource /lawhati/index.html
</Directory>

<IfModule mod_headers.c>
    # Pages are checked for a newer version on every visit…
    <Location "/lawhati/">
        Header set Cache-Control "no-cache"
    </Location>
    # …while scripts and assets carry a content hash in their names, so they can be kept for good.
    <LocationMatch "^/lawhati/(_expo|assets)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # Only the app itself may load the hand-over page, in a hidden frame.
    <Location "/lawhati/migrate.html">
        Header set Content-Security-Policy "frame-ancestors https://faisaldev.site"
    </Location>
</IfModule>
