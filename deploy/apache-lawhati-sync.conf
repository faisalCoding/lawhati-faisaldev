# «لوحتي» real-time sync, for this instance only.
#
# Scoped by path, not by host: Apache refuses ProxyPass inside <If> outright —
#   AH00526: ProxyPass cannot occur within <If> section
# — because the proxy is resolved before a request's conditions are evaluated.
# /lawhati-sync/ is unique on this server, so nothing collides: the other
# instance here declares /kanban-sync/, server-wide and with no guard of its
# own. A shared path would have gone to whichever conf Apache read last.
#
# To keep this off the other sites on this machine entirely, move the two
# ProxyPass lines into the faisaldev.site vhost instead of enabling this conf.
#
# Requires: a2enmod proxy proxy_http (Apache 2.4.47+ for upgrade=websocket).
# Undo with: a2disconf lawhati-faisaldev-sync && systemctl reload apache2
<IfModule mod_proxy_http.c>
    ProxyPass        "/lawhati-sync/" "http://127.0.0.1:8788/" upgrade=websocket
    ProxyPassReverse "/lawhati-sync/" "http://127.0.0.1:8788/"
</IfModule>
