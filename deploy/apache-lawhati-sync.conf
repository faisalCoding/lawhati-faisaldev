# «لوحتي» real-time sync, for this instance only.
#
# Scoped to its own host and its own path. The server also runs another
# instance whose proxy is declared server-wide with no host guard; a shared
# path would go to whichever conf Apache reads last, and the wrong app would
# answer. Neither is left to chance here.
#
# Requires: a2enmod proxy proxy_http (Apache 2.4.47+ for upgrade=websocket).
# Undo with: a2disconf lawhati-faisaldev-sync && systemctl reload apache2
<IfModule mod_proxy_http.c>
    <If "%{HTTP_HOST} == 'faisaldev.site' || %{HTTP_HOST} == 'www.faisaldev.site'">
        ProxyPass        "/lawhati-sync/" "http://127.0.0.1:8788/" upgrade=websocket
        ProxyPassReverse "/lawhati-sync/" "http://127.0.0.1:8788/"
    </If>
</IfModule>
